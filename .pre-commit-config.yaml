repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Format Python Files
        entry: backend/dev/Scripts/python.exe -m ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-lint
        name: Lint Python Files
        entry: backend/dev/Scripts/python.exe -m ruff check . --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Type Check Python Files
        entry: backend/dev/Scripts/python.exe -m mypy backend --config-file backend/pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
